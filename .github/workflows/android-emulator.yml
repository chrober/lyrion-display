name: Android device smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    name: Android emulator API ${{ matrix.api-level }} smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # API 22 verifies the legacy visual-ready fallback. API 25 is the
        # Fire TV Stick 4K (2018, AFTMM) Fire OS 6 compatibility gate.
        # An AOSP API 25 emulator is a compatibility gate, not a substitute
        # for manual remote/WebView testing on the actual Amazon hardware.
        include:
          - api-level: 22
            arch: x86
          - api-level: 25
            arch: x86_64
          - api-level: 29
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Enable KVM acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: ${{ matrix.arch }}
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
