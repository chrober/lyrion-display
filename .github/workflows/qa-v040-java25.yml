name: v0.4.0 Java 25 F-Droid reproducibility QA (no publishing)

on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - tools/qa_java25_fdroid_rebuild.sh
      - .github/workflows/qa-v040-java25.yml
      - .github/workflows/ci.yml
      - .github/workflows/release-candidate.yml
      - gradle.properties
      - build.gradle
  push:
    branches: [main]
    paths:
      - app/**
      - tools/qa_java25_fdroid_rebuild.sh
      - .github/workflows/qa-v040-java25.yml
      - .github/workflows/ci.yml
      - .github/workflows/release-candidate.yml
      - gradle.properties
      - build.gradle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v040-java25-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-unsigned:
    name: Rebuild with F-Droid Trixie Java 25 and compare unsigned APKs
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Build unsigned Java 25 v0.4.0 APK
        shell: bash
        run: |
          java -version
          python3 tools/check_fdroid_recipe.py
          test -z "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Independently rebuild and compare with Java 25 in F-Droid Trixie
        shell: bash
        run: bash tools/qa_java25_fdroid_rebuild.sh
      - name: Upload non-APK reproducibility result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v040-java25-fdroid-reproducibility-evidence
          path: qa-java25-v040-result.txt
          if-no-files-found: ignore
          retention-days: 14
