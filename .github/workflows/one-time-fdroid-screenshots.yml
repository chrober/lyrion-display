name: One-time F-Droid screenshot preparation (temporary)
on:
  push:
    branches:
      - rc/v0.4.1

permissions:
  contents: write

jobs:
  convert:
    if: github.repository == 'chrober/lyrion-display'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Convert the already approved, anonymized Settings image to JPEG
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target = Path("fastlane/metadata/android/en-US/images/phoneScreenshots/2.jpg")
          target.parent.mkdir(parents=True, exist_ok=True)
          with Image.open("screenshots/settings.webp") as source:
              source.convert("RGB").save(target, format="JPEG", quality=87, subsampling=0, optimize=True)
          print("Prepared", target, target.stat().st_size, "bytes")
          PY
      - name: Commit generated screenshot only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fastlane/metadata/android/en-US/images/phoneScreenshots/2.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'docs(fdroid): convert approved anonymized Settings screenshot for store'
            git push origin HEAD:rc/v0.4.1
          fi
