name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (API 22+)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android SDK
        shell: bash
        run: |
          # GitHub-hosted Ubuntu runners already have an Android SDK.
          # setup-android@v3 currently attempts to install the retired "tools" package.
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_bin" && test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Verify classic PNG icon assets
        run: python3 tools/verify_launcher_assets.py
      - name: Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify PNG resources inside built APK
        run: python3 tools/verify_launcher_assets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Build unsigned release APK (F-Droid source-build preflight)
        shell: bash
        run: |
          test -z "${ANDROID_KEYSTORE_PATH:-}"
          gradle --no-daemon :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          python3 tools/verify_launcher_assets.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/unsigned-badging.txt"
          # Read the manifest version from Gradle; do not freeze CI to a prior release.
          version_code=$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\\1/p" app/build.gradle)
          version_name=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*$/\\1/p" app/build.gradle)
          test -n "$version_code" && test -n "$version_name"
          grep -Fq "name='com.chrober.lmsmaterial.nowplaying' versionCode='${version_code}' versionName='${version_name}'" "$RUNNER_TEMP/unsigned-badging.txt"
          echo "Validated unsigned APK: ${version_name} (versionCode ${version_code})"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo "::error::F-Droid preflight must create an unsigned release, not a signed APK"
            exit 1
          fi
          echo "Unsigned release APK generated and validated."
      - name: Independently reproduce unsigned APK in F-Droid Trixie (Java 25)
        shell: bash
        run: bash tools/qa_fdroid_rebuild.sh
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/lyrion-display-debug.apk
      - name: Publish independent F-Droid QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-reproducibility-evidence
          path: qa-fdroid-reproducibility-result.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lyrion-display-debug
          path: app/build/outputs/apk/debug/lyrion-display-debug.apk
          if-no-files-found: error

  one-time-v040-dryrun-dispatch:
    name: One-time manual-request F-Droid dry-run dispatch (NO SUBMISSION)
    if: >-
      github.repository == 'chrober/lyrion-display' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[fdroid-dry-run-dispatch-20261123]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start only v0.4.0 dry-run via workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # One-time bridge from the explicit user request. This job has no
          # GitLab secret, environment, or permission to submit an MR.
          payload='{"ref":"main","inputs":{"release_tag":"v0.4.0","mode":"dry-run","confirmation":""}}'
          curl --fail --silent --show-error --location --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/chrober/lyrion-display/actions/workflows/fdroid-submit.yml/dispatches"
          echo 'Requested a v0.4.0 dry-run only; no GitLab submission.'
