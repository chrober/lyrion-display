name: F-Droid metadata and source-build preflight (no publishing)

on:
  pull_request:
    branches: [main]
    paths:
      - fdroid/**
      - gradle/wrapper/gradle-wrapper.properties
      - tools/check_fdroid_recipe.py
      - .github/workflows/fdroid-preflight.yml
      - .github/workflows/fdroid-submit.yml
      - tools/fdroid_prepare_submission.py
      - tools/fdroid_submit_gitlab.py
      - tools/tests/test_fdroid_*.py
      - docs/FDROID_MANUAL_PUBLISHING.md
      - docs/FDROID_PACKAGING.md
      - docs/FDROID_READINESS.md
  workflow_dispatch:
    inputs:
      source_build:
        description: 'Run exact published release source build and signature comparison (no publishing)'
        type: boolean
        default: false
      buildserver_image:
        description: 'Run exact-release Trixie build using the official recipe Java 17 sudo steps (no publishing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fdroid-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fdroid-metadata:
    name: Validate disabled F-Droid recipe with fdroidserver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install F-Droid metadata tools
        run: python -m pip install --disable-pip-version-check 'fdroidserver==2.4.5' PyYAML
      - name: Check version, source SHA and disabled recipe
        run: python tools/check_fdroid_recipe.py
      - name: Test manually generated submission metadata and no-auto-update safeguards
        run: python -m unittest discover -s tools/tests -p 'test_fdroid_*.py' -v
      - name: Lint generated v0.4.0 submission recipe before a release tag exists
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          from tools.fdroid_prepare_submission import APP_ID, build_metadata
          base = yaml.safe_load(Path("fdroid/metadata", APP_ID + ".yml").read_text())
          gradle = Path("app/build.gradle").read_text()
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          metadata = build_metadata(base, "v0.4.0", sha, gradle)
          description = Path("fastlane/metadata/android/en-US")
          metadata["Summary"] = (description / "short_description.txt").read_text().strip()
          metadata["Description"] = (description / "full_description.txt").read_text().strip()
          output = Path("fdroid-submission/metadata", APP_ID + ".yml")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(yaml.safe_dump(metadata, sort_keys=False, allow_unicode=True))
          PY
          mkdir -p fdroid-submission/config
          cp fdroid/config/categories.yml fdroid-submission/config/categories.yml
          (
            cd fdroid-submission
            fdroid readmeta
            fdroid lint com.chrober.lmsmaterial.nowplaying
          )
      - name: Validate using F-Droid's metadata parser and linter
        shell: bash
        run: |
          cd fdroid
          fdroid readmeta
          fdroid lint com.chrober.lmsmaterial.nowplaying


  fdroid-source-build:
    name: Exact-release source rebuild (manual, no publishing)
    if: github.event_name == 'workflow_dispatch' && inputs.source_build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
          cache-provider: basic
      - name: Install test-only F-Droid and signature tools
        run: python3 -m pip install --disable-pip-version-check 'fdroidserver==2.4.5' PyYAML 'apksigcopier==1.1.1'
      - name: Validate disabled recipe and extract exact pinned release
        id: pinned
        run: |
          python3 tools/check_fdroid_recipe.py
          python3 - <<'PY'
          import os, yaml
          with open("fdroid/metadata/com.chrober.lmsmaterial.nowplaying.yml", encoding="utf-8") as f:
              recipe = yaml.safe_load(f)
          b = recipe["Builds"][0]
          assert b["disable"], "Recipe must remain disabled"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_sha={b['commit']}\n")
              out.write(f"version_code={b['versionCode']}\n")
              out.write(f"version_name={b['versionName']}\n")
          PY
      - name: Map QA Java 17 to F-Droid's expected Gradle home
        shell: bash
        run: |
          # Local non-VM QA does not execute metadata sudo commands; use the
          # already-installed GitHub Actions JDK 17 at the recipe's fixed path.
          test -x "$JAVA_HOME/bin/java"
          if ! test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java; then
            sudo mkdir -p /usr/lib/jvm
            sudo ln -s "$JAVA_HOME" /usr/lib/jvm/java-17-openjdk-amd64
          fi
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version
      - name: Build pinned release using fdroidserver scanner
        env:
          SOURCE_SHA: ${{ steps.pinned.outputs.source_sha }}
          VERSION_CODE: ${{ steps.pinned.outputs.version_code }}
        shell: bash
        run: |
          cd fdroid
          printf "sdk_path: '%s'\n" "$ANDROID_HOME" > config.yml
          printf "gradle: '%s'\n" "$(command -v gradle)" >> config.yml
          fdroid readmeta
          fdroid lint com.chrober.lmsmaterial.nowplaying
          mkdir -p build
          git clone --quiet --no-checkout https://github.com/chrober/lyrion-display.git build/com.chrober.lmsmaterial.nowplaying
          git -C build/com.chrober.lmsmaterial.nowplaying checkout --quiet "$SOURCE_SHA"
          test "$(git -C build/com.chrober.lmsmaterial.nowplaying rev-parse HEAD)" = "$SOURCE_SHA"
          set -o pipefail
          fdroid build --test --force --verbose com.chrober.lmsmaterial.nowplaying 2>&1 | tee exact-release-build.log
          test -s "tmp/com.chrober.lmsmaterial.nowplaying_$VERSION_CODE.apk"
          if grep -Eq '[1-9][0-9]* build(s)? failed' exact-release-build.log; then exit 1; fi
      - name: Compare rebuilt APK with existing published signed APK (read-only download)
        env:
          VERSION_NAME: ${{ steps.pinned.outputs.version_name }}
          VERSION_CODE: ${{ steps.pinned.outputs.version_code }}
        shell: bash
        run: |
          signed="lyrion-display-v$VERSION_NAME.apk"
          url="https://github.com/chrober/lyrion-display/releases/download/v$VERSION_NAME/$signed"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -o "$signed" "$url"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -o "$signed.sha256" "$url.sha256"
          sha256sum -c "$signed.sha256"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$signed" | tee signed-release-cert.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: af624ba3a730a5bf4a9d0b77e2bed2ec557744705362d4a4445e6dcb125f1dfb' signed-release-cert.txt
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          apksigcopier compare --unsigned "$signed" "fdroid/tmp/com.chrober.lmsmaterial.nowplaying_$VERSION_CODE.apk"
          sha256sum "fdroid/tmp/com.chrober.lmsmaterial.nowplaying_$VERSION_CODE.apk" | tee unsigned-apk-sha256.txt
      - name: Upload test evidence only (never upload APK)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-local-source-build-evidence
          path: |
            fdroid/exact-release-build.log
            signed-release-cert.txt
            unsigned-apk-sha256.txt
          if-no-files-found: ignore
          retention-days: 14


  fdroid-buildserver-image:
    name: F-Droid Trixie recipe-driven Java 17 reproducibility (QA only)
    # PR/build QA only; no privileged credentials, GitLab submissions or publication.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.buildserver_image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install recipe and signature verification dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML 'apksigcopier==1.1.1'
      - name: Verify disabled recipe and extract immutable source version
        id: pinned
        shell: bash
        run: |
          python3 tools/check_fdroid_recipe.py
          python3 - <<'PY'
          import os, yaml
          with open("fdroid/metadata/com.chrober.lmsmaterial.nowplaying.yml", encoding="utf-8") as f:
              recipe = yaml.safe_load(f)
          b = recipe["Builds"][0]
          assert b["disable"], "Recipe must remain disabled"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_sha={b['commit']}\n")
              out.write(f"version_code={b['versionCode']}\n")
              out.write(f"version_name={b['versionName']}\n")
          PY
      - name: Prepare exact-release checkout and F-Droid source tools
        env:
          SOURCE_SHA: ${{ steps.pinned.outputs.source_sha }}
        shell: bash
        run: |
          mkdir -p fdroid/build
          git clone --quiet --no-checkout https://github.com/chrober/lyrion-display.git fdroid/build/com.chrober.lmsmaterial.nowplaying
          git -C fdroid/build/com.chrober.lmsmaterial.nowplaying checkout --quiet "$SOURCE_SHA"
          test "$(git -C fdroid/build/com.chrober.lmsmaterial.nowplaying rev-parse HEAD)" = "$SOURCE_SHA"
          git clone --quiet --depth=1 https://gitlab.com/fdroid/fdroidserver.git fdroidserver
          git -C fdroidserver rev-parse HEAD | tee fdroidserver-ci-tool-revision.txt
          chmod -R a+rX fdroidserver
      - name: Generate local-only test scripts from validated official metadata
        shell: bash
        run: |
          # Reuse the exact recipe's sudo steps. The checked validator only
          # permits the expected Bookworm JDK17 installation operations.
          python3 tools/check_fdroid_recipe.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          recipe = yaml.safe_load(Path("fdroid/metadata/com.chrober.lmsmaterial.nowplaying.yml").read_text(encoding="utf-8"))
          b = recipe["Builds"][0]
          assert b["disable"]
          setup = "#!/bin/bash\nset -euo pipefail\n" + "\n".join(b["sudo"]) + "\n"
          Path("fdroid/qa-sudo-setup.sh").write_text(setup, encoding="utf-8")
          PY
          cat > fdroid/qa-build-as-vagrant.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          . /etc/profile.d/bsenv.sh
          export PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver"
          git config --global --add safe.directory /home/vagrant/fdroidserver
          git config --global --add safe.directory /build/build/com.chrober.lmsmaterial.nowplaying
          echo "JDK selected by official recipe sudo operations:"
          java -version
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          /usr/lib/jvm/java-17-openjdk-amd64/bin/java -version
          fdroid readmeta
          fdroid lint com.chrober.lmsmaterial.nowplaying
          # --force is confined to QA because the review recipe is disabled.
          fdroid build --test --force --verbose com.chrober.lmsmaterial.nowplaying 2>&1 | tee exact-release-buildserver.log
          test -s "tmp/com.chrober.lmsmaterial.nowplaying_$VERSION_CODE.apk"
          if grep -Eq '[1-9][0-9]* build(s)? failed' exact-release-buildserver.log; then exit 1; fi
          SH
          chmod -R a+rwX fdroid
      - name: Install Debian Bookworm Java 17 via F-Droid sudo recipe and rebuild
        env:
          VERSION_CODE: ${{ steps.pinned.outputs.version_code }}
        shell: bash
        run: |
          # Root setup mirrors the official buildserver's per-build 'sudo:'
          # phase; compilation then runs unprivileged as the vagrant user.
          # The F-Droid local test mode does NOT execute sudo by itself.
          docker run --rm --user root --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE/fdroid:/build" -w /build \
            -v "$GITHUB_WORKSPACE/fdroidserver:/home/vagrant/fdroidserver:ro" \
            -e VERSION_CODE="$VERSION_CODE" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            -e -u -o pipefail -c '
              bash /build/qa-sudo-setup.sh 2>&1 | tee /build/fdroid-sudo-setup.log
              test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
              runuser -u vagrant -- env HOME=/home/vagrant VERSION_CODE="$VERSION_CODE" \
                /bin/bash /build/qa-build-as-vagrant.sh
            '
      - name: Compare unsigned recipe build against existing developer-signed release
        env:
          VERSION_NAME: ${{ steps.pinned.outputs.version_name }}
          VERSION_CODE: ${{ steps.pinned.outputs.version_code }}
        shell: bash
        run: |
          signed="lyrion-display-v$VERSION_NAME.apk"
          url="https://github.com/chrober/lyrion-display/releases/download/v$VERSION_NAME/$signed"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -o "$signed" "$url"
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors -o "$signed.sha256" "$url.sha256"
          sha256sum -c "$signed.sha256"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'build-tools;34.0.0'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$signed" | tee signed-release-cert.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: af624ba3a730a5bf4a9d0b77e2bed2ec557744705362d4a4445e6dcb125f1dfb' signed-release-cert.txt
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          unsigned="fdroid/tmp/com.chrober.lmsmaterial.nowplaying_$VERSION_CODE.apk"
          sha256sum "$unsigned" | tee unsigned-apk-sha256.txt
          python3 - "$signed" "$unsigned" <<'PY' | tee apk-entry-comparison.txt
          import hashlib, sys, zipfile
          def digest(data): return hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(sys.argv[1]) as signed, zipfile.ZipFile(sys.argv[2]) as rebuilt:
              original, candidate = set(signed.namelist()), set(rebuilt.namelist())
              print("Only in signed APK:", sorted(original - candidate))
              print("Only in rebuilt APK:", sorted(candidate - original))
              changed = [name for name in sorted(original & candidate)
                         if signed.read(name) != rebuilt.read(name)]
              print("Entries with differing uncompressed content:", len(changed))
              for name in changed:
                  print(name, "signed="+digest(signed.read(name)), "rebuilt="+digest(rebuilt.read(name)))
          PY
          apksigcopier compare --unsigned "$signed" "$unsigned"
      - name: Upload QA evidence only (no APKs or publication)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-official-recipe-qa-evidence
          path: |
            fdroid/fdroid-sudo-setup.log
            fdroid/exact-release-buildserver.log
            fdroidserver-ci-tool-revision.txt
            signed-release-cert.txt
            unsigned-apk-sha256.txt
            apk-entry-comparison.txt
          if-no-files-found: ignore
          retention-days: 14
