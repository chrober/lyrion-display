plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chrober.lmsmaterial.nowplaying'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chrober.lmsmaterial.nowplaying'
        minSdk 22
        targetSdk 35
        versionCode 11
        versionName '0.4.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        production {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8 removes unused code and obfuscates implementation details in future
            // releases. The immutable v0.4.0 APK/tag are intentionally unchanged.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // F-Droid builds from source without the developer's private signing key.
            // Preserve production signing for GitHub releases when configured.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.production
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json implementation is only a stub in host-side JVM tests.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
