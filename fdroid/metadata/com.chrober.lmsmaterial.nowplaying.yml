Builds:
  - versionName: '0.3.0'
    versionCode: 9
    commit: fb4cb6359e1931519f586d6602c25e9b95e51e03
    disable: 'QA-only source reproducibility verification; official F-Droid buildserver and metadata approval outstanding.'
    subdir: app
    # F-Droid's supported buildserver mechanism: install Debian Bookworm JDK 17
    # in the disposable Trixie VM. Java 21 changes classes.dex and breaks
    # reproducible upstream signing for the existing v0.3.0 release.
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    # Explicitly select Java 17 for the Gradle daemon even if its outer
    # launcher inherits an older/default JAVA_HOME.
    prebuild:
      - echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" >> ../gradle.properties
    gradle:
      - 'yes'

